<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="430" viewBox="0 0 1140 430" role="img" aria-labelledby="title desc"><title id="title">MNEMOSYNT : mémoire, états et provenance</title><desc id="desc">Schéma d’intention : observation, interprétation, état actuel, provenance, et séparation du commun et du privé. Cette chaîne est un modèle d’architecture, pas la preuve d’une validation fonctionnelle complète.</desc><rect width="1140" height="430" fill="#111111"/><rect width="1140" height="42" fill="#F5B800"/><text x="24" y="27" font-family="monospace" font-size="16" font-weight="800" fill="#111">ATELIER / FIELD MAP</text><text x="1116" y="27" text-anchor="end" font-family="monospace" font-size="12" font-weight="800" fill="#111">SCHÉMA EXPLICATIF / PAS UNE CAPTURE</text><g stroke="#353535" stroke-width="1" fill="none"><path d="M0 42 V430"/><path d="M85 42 V430"/><path d="M170 42 V430"/><path d="M255 42 V430"/><path d="M340 42 V430"/><path d="M425 42 V430"/><path d="M510 42 V430"/><path d="M595 42 V430"/><path d="M680 42 V430"/><path d="M765 42 V430"/><path d="M850 42 V430"/><path d="M935 42 V430"/><path d="M1020 42 V430"/><path d="M1105 42 V430"/><path d="M0 60 H1140"/><path d="M0 145 H1140"/><path d="M0 230 H1140"/><path d="M0 315 H1140"/><path d="M0 400 H1140"/></g><text x="26" y="80" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#f6f0df">MNEMOSYNT / UN SOUVENIR N’EST PAS UNE PREUVE</text><rect x="28" y="114" width="235" height="165" rx="2" fill="#211e15" stroke="#f5b800" stroke-width="2"/><text x="45" y="151" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#f5b800">01 / OBSERVER</text><text x="45" y="185" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Événement daté</text><text x="45" y="211" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Source identifiée</text><text x="45" y="245" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#f