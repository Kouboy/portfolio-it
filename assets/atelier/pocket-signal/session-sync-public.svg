ect x="432" y="115" width="276" height="197" rx="2" fill="#f6f0df" stroke="#f6f0df" stroke-width="2"/><text x="454" y="152" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111">KOUBOYPI</text><text x="454" y="183" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#111">ATELIER POCKET</text><text x="454" y="227" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#111">Sessions versionnées</text><text x="454" y="257" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#333">Échanges sur réseau privé</text><rect x="831" y="127" width="275" height="175" rx="2" fill="#1c2326" stroke="#37d4e9" stroke-width="2"/><text x="853" y="164" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#37d4e9">IMPERATOR</text><text x="853" y="195" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ddd">CLIENT WINDOWS</text><text x="853" y="235" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Retrouver / modifier</text><text x="853" y="265" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#eee">Depuis le navigateur</text><path d="M310 204 H431" fill="none" stroke="#f5b800" stroke-width="4" stroke-dasharray="9 7"/><path d="M420 196 L430 204 L420 212" stroke="#f5b800" fill="none" stroke-width="3"/><path d="M431 231 H310" fill="none" stroke="#f5b800" stroke-width="2"/><path d="M321 223 L311 231 L321 239" stroke="#f5b800" fill="none" stroke-width="2"/><path d="M710 204 H830" fill="none" stroke="#37d4e9" stroke-width="4" stroke-dasharray="9 7"/><path d="M819 196 L830 204 L819 212" stroke="#37d4e9" fill="none" stroke-width="3"/><path d="M830 231 H710" fill="none" stroke="#37d4e9" stroke-width="2"/><path d="M721 223 L711 231 L721 239" stroke="#37d4e9" fill="none" stroke-width="2"/><rect x="128" y="336" width="884" height="40" rx="2" fill="#201d16" stroke="#f5b800" stroke-width="2"/><text x="149" y="362" font-family="Arial,sans-serif"